<style>
:root{--bg:#0d0f14;--panel:#161a22;--panel2:#1d222c;--ink:#f2efe9;--muted:#7c828f;--line:#262c38;
  --gold:#f5c451;--fr:#5ed3a8;--afm:#6aa1ff;--aape:#ff8a6b;--good:#5ed3a8;--grad:linear-gradient(135deg,#f5c451,#e89a3c)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:'DM Mono',monospace;min-height:100vh;
  padding:env(safe-area-inset-top) 0 40px;
  background-image:radial-gradient(circle at 15% 8%,rgba(245,196,81,.06),transparent 45%)}
.app{max-width:480px;margin:0 auto;padding:0 16px}
.top{display:flex;justify-content:space-between;align-items:flex-end;padding:22px 2px 6px}
.brand{font-family:'Fraunces',serif;font-weight:900;font-size:22px}.brand b{color:var(--gold)}
.brand small{display:block;font-family:'DM Mono';font-weight:400;font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-top:5px}
.cd{text-align:right}.cd .d{font-family:'Fraunces';font-weight:900;font-size:30px;color:var(--gold);line-height:1}.cd .l{font-size:8px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:14px;animation:rise .4s ease backwards}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.sec-t{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:14px;display:flex;justify-content:space-between}
/* live */
.live-card{display:flex;align-items:center;gap:18px}
.ring{width:74px;height:74px;border-radius:50%;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;position:relative;transition:.4s}
.ring.on{border-color:var(--good)}
.ring .core{width:52px;height:52px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-family:'Fraunces';font-weight:900;font-size:15px;color:var(--muted)}
.ring.on .core{color:var(--good)}
.ring.on::before{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--good);opacity:.5;animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.22);opacity:0}}
.live-info .s{font-family:'Fraunces';font-weight:900;font-size:20px}.live-info .s.on{color:var(--good)}.live-info .s.off{color:var(--muted)}
.live-info .meta{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5}
.live-info .meta b{color:var(--ink)}
.dotp{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;animation:bl 1.1s infinite}@keyframes bl{50%{opacity:.2}}
/* stats */
.strip{display:flex;gap:10px;margin-bottom:14px}
.st{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center}
.st .n{font-family:'Fraunces';font-weight:900;font-size:22px;color:var(--gold)}.st .n .u{font-size:11px;color:var(--muted)}
.st .l{font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:3px}
.st.streak .n{color:var(--good)}
/* paper rows */
.prow{margin-bottom:15px}.prow:last-child{margin-bottom:0}
.prow .h{display:flex;justify-content:space-between;font-size:12px}.prow .h span{color:var(--muted);font-size:11px}
.bar{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;border-radius:6px;transition:width .6s}
.prow.fr .bar i{background:var(--fr)}.prow.afm .bar i{background:var(--afm)}.prow.aape .bar i{background:var(--aape)}
.pmeta{font-size:10px;color:var(--muted);margin-top:5px}
/* chart */
.chart{display:flex;align-items:flex-end;gap:7px;height:100px;margin-top:6px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;justify-content:flex-end;height:100%}
.col .stack{width:100%;display:flex;flex-direction:column-reverse;border-radius:5px;overflow:hidden}.col .stack div{width:100%}
.col .lab{font-size:9px;color:var(--muted)}.col .tot{font-size:8px;color:var(--ink)}
.legend{display:flex;gap:14px;justify-content:center;margin-top:12px;font-size:9px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
/* log */
.log{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto}
.entry{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.entry .left{display:flex;align-items:center;gap:10px;min-width:0}
.pp{font-size:8px;letter-spacing:.5px;padding:3px 7px;border-radius:5px;text-transform:uppercase;font-weight:500}
.entry .nt{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.entry .dt{font-size:9px;color:var(--muted);margin-top:2px}
.entry .dur{font-family:'Fraunces';font-weight:900;font-size:15px;color:var(--gold);flex:none;margin-left:8px}
/* tasks */
.tk{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px;font-size:12px}
.tk.done{opacity:.5}.tk.done .x{text-decoration:line-through;color:var(--muted)}
.tk .b{width:16px;height:16px;border-radius:5px;border:2px solid var(--line);flex:none}.tk.done .b{background:var(--good);border-color:var(--good)}
.tk .x{flex:1}.tk .dd{font-size:9px;color:var(--gold);text-transform:uppercase}
/* guide add */
.gadd{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.gadd input{background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-family:'DM Mono';font-size:13px;padding:11px 13px;outline:none}
.gadd input:focus{border-color:var(--gold)}.gadd input[type=date]{color-scheme:dark}.gadd input::placeholder{color:var(--muted)}
.gadd button{background:var(--grad);color:#1a1206;border:none;border-radius:10px;font-family:'DM Mono';font-weight:500;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;padding:13px;cursor:pointer}
.gadd .ok{color:var(--good);font-size:10px;text-align:center;min-height:12px}
.tgrid{display:flex;gap:8px}.tgrid input{flex:1}
.empty{text-align:center;color:var(--muted);font-size:11px;padding:20px 0}
.err{color:#ff6b5e;font-size:11px;text-align:center;min-height:12px;margin-top:6px}
.refresh{font-size:9px;color:var(--muted);text-align:center;padding:8px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">Guide<b>.</b><small>CA Final · Dashboard · <span id="verTag"></span></small></div>
    <div class="cd"><div class="d" id="cd">—</div><div class="l">days to Nov '26</div></div>
  </div>

  <div class="card live-card">
    <div class="ring" id="ring"><div class="core" id="core">··</div></div>
    <div class="live-info">
      <div class="s off" id="lstat">Connecting…</div>
      <div class="meta" id="lmeta"></div>
    </div>
  </div>

  <div class="strip">
    <div class="st"><div class="n" id="sToday">0<span class="u">h</span></div><div class="l">Today</div></div>
    <div class="st streak"><div class="n" id="sStreak">0</div><div class="l">Streak</div></div>
    <div class="st"><div class="n" id="sWeek">0<span class="u">h</span></div><div class="l">Week</div></div>
    <div class="st"><div class="n" id="sTotal">0<span class="u">h</span></div><div class="l">Total</div></div>
  </div>

  <div class="card"><div class="sec-t">Paper Progress</div><div id="papers"></div></div>

  <div class="card"><div class="sec-t">Topics Completed</div>
    <div style="display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:8px">
      <button style="flex:1;padding:8px;font-size:11px;font-weight:600;background:none;border:none;border-bottom:2px solid var(--gold);color:var(--gold);cursor:pointer" data-tp="FR" onclick="switchTopicView('FR')">FR</button>
      <button style="flex:1;padding:8px;font-size:11px;font-weight:600;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer" data-tp="AFM" onclick="switchTopicView('AFM')">AFM</button>
      <button style="flex:1;padding:8px;font-size:11px;font-weight:600;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer" data-tp="AAPE" onclick="switchTopicView('AAPE')">AAPE</button>
    </div>
    <div id="topicsView" style="max-height:300px;overflow-y:auto;font-size:11px"></div>
  </div>

  <div class="card"><div class="sec-t">Last 7 Days</div><div class="chart" id="chart"></div>
    <div class="legend"><span><i style="background:var(--fr)"></i>FR</span><span><i style="background:var(--afm)"></i>AFM</span><span><i style="background:var(--aape)"></i>AAPE</span></div>
  </div>

  <div class="card"><div class="sec-t">This Week's Checklist</div><div id="tasks"></div></div>

  <div class="card"><div class="sec-t">Scheduled Plan</div><div id="plan"></div></div>

  <div class="card"><div class="sec-t">Set a Target for Her</div>
    <div class="gadd">
      <div class="tgrid">
        <input id="gT" placeholder="task / topic">
        <input id="gD" type="date">
      </div>
      <button id="gAddPlan">Push Scheduled Task</button>
      <div class="ok" id="gOk1"></div>
    </div>
    <div class="gadd" style="margin-top:14px;border-top:1px solid var(--line);padding-top:14px">
      <div class="tgrid">
        <input id="gFR" type="number" placeholder="FR hrs">
        <input id="gAFM" type="number" placeholder="AFM hrs">
        <input id="gAAPE" type="number" placeholder="AAPE hrs">
      </div>
      <div class="tgrid">
        <input id="gDaily" type="number" step="0.5" placeholder="daily goal hrs">
        <input id="gWeekly" type="number" placeholder="weekly hrs">
      </div>
      <button id="gAddTargets">Push Targets</button>
      <div class="ok" id="gOk2"></div>
    </div>
  </div>

  <div class="card"><div class="sec-t">Full Session Log</div><div class="log" id="log"></div></div>
  <div class="refresh" id="refresh">auto-refresh every 30s</div>
  <div class="err" id="err"></div>
</div>

<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbw_Ea7pgPXwX1FvPXWpcLJHP9t7gLsDlanp_IhgClHyD20KQhSgfOY7R1ymXb7HmtDr3w/exec";
const VERSION="v2.2", EXAM_DATE="2026-11-01", STALE_MIN=3;
const PAPERS=["FR","AFM","AAPE"], PNAME={FR:"Financial Reporting",AFM:"Adv. Fin. Mgmt",AAPE:"Adv. Auditing"};
const $=id=>document.getElementById(id);
const fmtH=m=>{const h=m/60;return h>=10?Math.round(h):h.toFixed(1).replace(/\.0$/,'');};
const fmtDur=mins=>{mins=Math.round(mins);if(mins<60)return mins+'m';const h=Math.floor(mins/60),m=mins%60;return m?h+'h '+m+'m':h+'h';};
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todayKey=()=>new Date().toLocaleDateString('en-CA');
function weekStart(d=new Date()){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x.toLocaleDateString('en-CA');}
function ago(ts){if(!ts)return'';const m=Math.floor((Date.now()-ts)/60000);if(m<1)return'just now';if(m<60)return m+'m ago';return Math.floor(m/60)+'h '+(m%60)+'m ago';}

let SESS=[], STATE={}, TOPICS=[], filterTopicsPaper='FR';

async function pull(){
  try{
    const r=await fetch(SHEET_URL+'?t='+Date.now());
    const d=await r.json();
    SESS=d.sessions||[]; STATE=d.state||{}; TOPICS=d.topicsData||[];
    $('err').textContent='';
    renderLive(d.live||{}); renderStats(); renderPapers(); renderChart(); renderTasks(); renderPlan(); renderTopics(); renderLog(); renderCd();
  }catch(e){ $('err').textContent='Can\'t reach the sheet — check connection / deployment access'; }
}
async function pullLive(){
  try{ const r=await fetch(SHEET_URL+'?live=1&t='+Date.now()); renderLive(await r.json()); }catch(e){}
}

function renderCd(){const diff=Math.ceil((new Date(EXAM_DATE)-new Date())/864e5);$('cd').textContent=diff>0?diff:'0';}
function renderLive(l){
  const on = l.status==='studying';   // stays studying until an 'idle' ping arrives
  if(on){
    $('ring').classList.add('on');$('core').textContent=l.paper||'·';
    $('lstat').className='s on';$('lstat').innerHTML='<span class="dotp"></span>Studying';
    const mins=l.startedAt?Math.floor((Date.now()-l.startedAt)/60000):(l.elapsed||0);
    $('lmeta').innerHTML=`<b>${l.paper||'—'}</b> · ${mins>=60?Math.floor(mins/60)+'h ':''}${mins%60}m${l.note?'<br>'+esc(l.note):''}<br>started ${ago(l.startedAt||l.updated)}`;
  }else{
    $('ring').classList.remove('on');$('core').textContent='··';
    $('lstat').className='s off';$('lstat').textContent='Not studying';
    $('lmeta').innerHTML=l.updated?('idle · last active '+ago(l.updated)):'no activity yet';
  }
}
function renderStats(){
  const t=todayKey(),w=weekStart();
  const td=SESS.filter(s=>s.date===t).reduce((a,s)=>a+s.mins,0);
  const wk=SESS.filter(s=>weekStart(new Date(s.ts))===w).reduce((a,s)=>a+s.mins,0);
  const tot=SESS.reduce((a,s)=>a+s.mins,0);
  $('sToday').innerHTML=fmtDur(td);
  $('sWeek').innerHTML=fmtDur(wk);
  $('sTotal').innerHTML=fmtDur(tot);
  const goal=(STATE.dailyGoal||6)*60;let n=0;
  for(let i=0;i<400;i++){const d=new Date();d.setDate(d.getDate()-i);const k=d.toLocaleDateString('en-CA');
    const m=SESS.filter(s=>s.date===k).reduce((a,s)=>a+s.mins,0);if(m>=goal)n++;else{if(i===0)continue;break;}}
  $('sStreak').textContent=n;
}
function renderPapers(){
  const tg=STATE.targets||{FR:170,AFM:170,AAPE:170}, pr=STATE.portion||{FR:0,AFM:0,AAPE:0};
  $('papers').innerHTML=PAPERS.map(p=>{
    const m=SESS.filter(s=>s.paper===p).reduce((a,s)=>a+s.mins,0);
    const pc=Math.min(100,Math.round((m/60)/tg[p]*100));
    return `<div class="prow ${p.toLowerCase()}"><div class="h"><b>${p} <span>${PNAME[p]}</span></b><span>${m<60?m+'m':fmtH(m)+'h'} / ${tg[p]}h</span></div>
      <div class="bar"><i style="width:${pc}%"></i></div>
      <div class="pmeta">${pc}% of hours · ${pr[p]||0}% syllabus done</div></div>`;
  }).join('');
}
function renderChart(){
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d);}
  const max=Math.max(60,...days.map(d=>{const k=d.toLocaleDateString('en-CA');return SESS.filter(s=>s.date===k).reduce((a,s)=>a+s.mins,0);}));
  const cm={FR:'var(--fr)',AFM:'var(--afm)',AAPE:'var(--aape)'};
  $('chart').innerHTML=days.map(d=>{const k=d.toLocaleDateString('en-CA');
    const seg=PAPERS.map(p=>{const m=SESS.filter(s=>s.date===k&&s.paper===p).reduce((a,s)=>a+s.mins,0);return m?`<div style="height:${m/max*88}px;background:${cm[p]}"></div>`:'';}).join('');
    const tot=SESS.filter(s=>s.date===k).reduce((a,s)=>a+s.mins,0);
    return `<div class="col"><div class="tot">${tot?(tot<60?tot+'m':fmtH(tot)+'h'):''}</div><div class="stack" style="height:${tot/max*88}px">${seg}</div><div class="lab">${'SMTWTFS'[d.getDay()]}</div></div>`;}).join('');
}
function renderTasks(){
  const w=weekStart();const list=(STATE.tasks||[]).filter(t=>t.week===w||!t.done);
  $('tasks').innerHTML=list.length?list.map(t=>`<div class="tk ${t.done?'done':''}"><div class="b"></div><div class="x">${esc(t.text)}</div></div>`).join(''):'<div class="empty">No weekly tasks</div>';
}
function renderPlan(){
  const list=(STATE.plan||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  $('plan').innerHTML=list.length?list.map(p=>{const d=p.date?new Date(p.date+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}):'';
    return `<div class="tk ${p.done?'done':''}"><div class="b"></div><div class="x">${esc(p.text)}</div><div class="dd">${d}</div></div>`;}).join(''):'<div class="empty">No scheduled plan</div>';
}
function renderLog(){
  const cm={FR:'rgba(94,211,168,.18);color:var(--fr)',AFM:'rgba(106,161,255,.18);color:var(--afm)',AAPE:'rgba(255,138,107,.18);color:var(--aape)'};
  const list=SESS.slice().sort((a,b)=>b.ts-a.ts).slice(0,60);
  $('log').innerHTML=list.length?list.map(s=>{const d=new Date(s.ts);
    return `<div class="entry"><div class="left"><span class="pp" style="background:${cm[s.paper]}">${s.paper}</span>
      <div><div class="nt">${esc(s.note)||'<span style="color:var(--muted)">no note</span>'}</div>
      <div class="dt">${d.toLocaleDateString(undefined,{month:'short',day:'numeric'})} · ${d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}</div></div></div>
      <div class="dur">${fmtDur(s.mins)}</div></div>`;}).join(''):'<div class="empty">No sessions logged yet</div>';
}

/* guide pushes */
function post(body){
  return new Promise(function(resolve){
    var url=SHEET_URL+'?data='+encodeURIComponent(JSON.stringify(body))+'&_='+Date.now();
    var img=new Image();var done=false;
    img.onload=img.onerror=function(){if(!done){done=true;resolve(true);}};
    img.src=url; setTimeout(function(){if(!done){done=true;resolve(true);}},8000);
  });
}
$('gAddPlan').onclick=async()=>{
  const text=($('gT').value||'').trim(),date=$('gD').value;
  if(!text||!date){$('gOk1').textContent='enter task + date';return;}
  await post({type:'guideAdd',planItem:{id:'g'+Date.now(),text,date,done:false}});
  $('gT').value='';$('gD').value='';$('gOk1').textContent='✓ pushed — she\'ll get it on next refresh';
  setTimeout(pull,1500);setTimeout(()=>$('gOk1').textContent='',4000);
};
$('gAddTargets').onclick=async()=>{
  const body={type:'guideAdd'};const tg={};
  if($('gFR').value)tg.FR=+$('gFR').value;if($('gAFM').value)tg.AFM=+$('gAFM').value;if($('gAAPE').value)tg.AAPE=+$('gAAPE').value;
  if(Object.keys(tg).length)body.targets=Object.assign({FR:170,AFM:170,AAPE:170},STATE.targets||{},tg);
  if($('gDaily').value)body.dailyGoal=+$('gDaily').value;
  if($('gWeekly').value)body.weeklyHrs=+$('gWeekly').value;
  await post(body);
  $('gOk2').textContent='✓ targets pushed';setTimeout(pull,1500);setTimeout(()=>$('gOk2').textContent='',4000);
};

function switchTopicView(paper){
  document.querySelectorAll('[data-tp]').forEach(b=>{
    b.style.color=b.getAttribute('data-tp')===paper?'var(--gold)':'var(--muted)';
    b.style.borderBottomColor=b.getAttribute('data-tp')===paper?'var(--gold)':'transparent';
  });
  filterTopicsPaper=paper;
  renderTopics();
}

function renderTopics(){
  const paper=filterTopicsPaper;
  const filtered=(TOPICS||[]).filter(t=>t.paper===paper);
  const done=filtered.filter(t=>t.done==='TRUE'||t.done===true).length;
  
  if(filtered.length===0){
    $('topicsView').innerHTML='<div style="color:var(--muted);font-size:11px;padding:12px;text-align:center">No topics yet</div>';
    return;
  }
  
  const html=`<div style="margin-bottom:8px;font-size:10px;color:var(--muted);padding:0 0 8px 0;border-bottom:1px solid var(--line)">${done}/${filtered.length} completed</div>`+
    filtered.map(t=>`<div style="padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center">
      <span style="flex:1">${t.name}</span>
      <span style="color:${t.done==='TRUE'||t.done===true?'var(--good)':'var(--muted)'};font-weight:600;font-size:12px">${t.done==='TRUE'||t.done===true?'✓':''}</span>
    </div>`).join('');
  $('topicsView').innerHTML=html;
}
