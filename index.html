<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CA Guide">
<title>CA Final Study Guide - Dashboard</title>

<style>
:root{
  --bg:#ffffff; --panel:#f5f5f5; --panel2:#ebebeb; --ink:#1a1a1a; --text:#1a1a1a; --muted:#666666;
  --line:#e0e0e0; --gold:#f5c451; --fr:#5ed3a8; --afm:#6aa1ff; --aape:#ff8a6b;
  --good:#5ed3a8; --danger:#ff6b5e; --grad:linear-gradient(135deg,#f5c451,#e89a3c);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;height:100vh;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}
.header{padding:16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.header .title{font-weight:700;font-size:16px}
.header .version{font-size:10px;color:var(--muted)}
.header button{border:none;background:none;cursor:pointer;font-size:16px}

.tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;padding:0 8px;gap:4px}
.tab{padding:12px 14px;font-size:12px;cursor:pointer;border:none;background:transparent;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;transition:all .3s;font-weight:600}
.tab.on{color:var(--ink);border-bottom-color:var(--gold)}

.views{flex:1;overflow-y:auto;padding:12px}
.view{display:none}
.view.on{display:block}

.card{background:var(--panel);border-radius:12px;padding:16px;margin-bottom:16px;border:1px solid var(--line)}
.sec-t{font-weight:600;font-size:13px;margin-bottom:8px;color:var(--ink)}

.live-ring{width:60px;height:60px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--gold);margin-bottom:16px;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,196,81,0.4)}70%{box-shadow:0 0 0 20px rgba(245,196,81,0)}100%{box-shadow:0 0 0 0 rgba(245,196,81,0)}}
.live-ring.active{background:rgba(94,211,168,0.2);color:var(--good);animation:pulse-green 2s infinite}
@keyframes pulse-green{0%{box-shadow:0 0 0 0 rgba(94,211,168,0.4)}70%{box-shadow:0 0 0 20px rgba(94,211,168,0)}100%{box-shadow:0 0 0 0 rgba(94,211,168,0)}}

.stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.stat{background:var(--panel2);padding:12px;border-radius:8px;text-align:center}
.stat .num{font-size:18px;font-weight:700;color:var(--gold);display:block}
.stat .lbl{font-size:10px;color:var(--muted);margin-top:4px}

.topic-row{padding:10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:11px}
.topic-row .name{flex:1}
.topic-row .check{color:var(--good);font-weight:600;font-size:12px;width:20px;text-align:right}

.progress-bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:6px}
.progress-bar .fill{height:100%;background:var(--gold);border-radius:3px;transition:width .3s}

.input-group{margin-bottom:12px}
.input-group label{display:block;font-size:10px;color:var(--muted);margin-bottom:6px}
.input-group input{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;font-size:12px}

.btn{width:100%;padding:12px;background:var(--gold);border:none;color:var(--ink);border-radius:6px;cursor:pointer;font-weight:600;font-size:12px;margin-top:8px}
.btn:active{opacity:.8}

.session-item{padding:8px;background:var(--panel2);border-radius:6px;margin-bottom:6px;font-size:10px;border-left:3px solid var(--gold)}
.session-item .time{color:var(--muted);font-size:9px}

.countdown{text-align:center;padding:16px;background:var(--panel2);border-radius:12px;margin-bottom:16px}
.countdown .days{font-size:24px;font-weight:700;color:var(--gold)}
.countdown .label{font-size:10px;color:var(--muted);margin-top:4px}
</style>

</head>
<body>

<div class="app">
  <div class="header">
    <div class="title">CA Final Guide</div>
    <div class="version" id="version">v3.0</div>
  </div>

  <div class="tabs">
    <div class="tab on" data-view="live" onclick="switchView('live')">Live</div>
    <div class="tab" data-view="today" onclick="switchView('today')">Today</div>
    <div class="tab" data-view="topics" onclick="switchView('topics')">Topics</div>
    <div class="tab" data-view="sessions" onclick="switchView('sessions')">Sessions</div>
    <div class="tab" data-view="manage" onclick="switchView('manage')">Manage</div>
  </div>

  <div class="views">
    <!-- LIVE -->
    <div class="view on" id="view-live">
      <div class="card">
        <div class="live-ring" id="liveRing">··</div>
        <div id="liveStatus" style="font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px">Not studying</div>
        <div id="liveMeta" style="font-size:11px;color:var(--muted);line-height:1.6"></div>
      </div>
      <div class="card">
        <div class="sec-t">Today's Stats</div>
        <div class="stats">
          <div class="stat"><span class="num" id="sToday">0h</span><span class="lbl">Today</span></div>
          <div class="stat"><span class="num" id="sWeek">0h</span><span class="lbl">Week</span></div>
          <div class="stat"><span class="num" id="sTotal">0h</span><span class="lbl">Total</span></div>
          <div class="stat"><span class="num" id="cd">—</span><span class="lbl">Days left</span></div>
        </div>
      </div>
    </div>

    <!-- TODAY -->
    <div class="view" id="view-today">
      <div class="card">
        <div class="sec-t">Paper Progress</div>
        <div id="papers"></div>
      </div>
      <div class="card">
        <div class="sec-t">Today's Sessions</div>
        <div id="todaySessions" style="max-height:200px;overflow-y:auto"></div>
      </div>
    </div>

    <!-- TOPICS -->
    <div class="view" id="view-topics">
      <div class="card">
        <div class="sec-t">Topics Completed</div>
        <div style="display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:8px">
          <button style="flex:1;padding:8px;font-size:11px;font-weight:600;background:none;border:none;border-bottom:2px solid var(--gold);color:var(--ink);cursor:pointer" data-tp="FR" onclick="switchTopics('FR')">FR</button>
          <button style="flex:1;padding:8px;font-size:11px;font-weight:600;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer" data-tp="AFM" onclick="switchTopics('AFM')">AFM</button>
          <button style="flex:1;padding:8px;font-size:11px;font-weight:600;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer" data-tp="AAPE" onclick="switchTopics('AAPE')">AAPE</button>
        </div>
        <div id="topicsList" style="max-height:400px;overflow-y:auto"></div>
      </div>
    </div>

    <!-- SESSIONS -->
    <div class="view" id="view-sessions">
      <div class="card">
        <div class="sec-t">Full Session Log</div>
        <div id="logList" style="max-height:500px;overflow-y:auto"></div>
      </div>
    </div>

    <!-- MANAGE -->
    <div class="view" id="view-manage">
      <div class="card">
        <div class="sec-t">Push a Task</div>
        <div class="input-group">
          <label>Task / Topic</label>
          <input type="text" id="gTask" placeholder="e.g., Revise Ind AS 115">
        </div>
        <div class="input-group">
          <label>Due Date</label>
          <input type="date" id="gDate">
        </div>
        <button class="btn" onclick="pushTask()">Push Task</button>
        <div id="taskMsg" style="font-size:10px;color:var(--good);margin-top:8px"></div>
      </div>

      <div class="card">
        <div class="sec-t">Set Study Targets</div>
        <div class="input-group">
          <label>FR Hours</label>
          <input type="number" id="gFR" placeholder="170">
        </div>
        <div class="input-group">
          <label>AFM Hours</label>
          <input type="number" id="gAFM" placeholder="170">
        </div>
        <div class="input-group">
          <label>AAPE Hours</label>
          <input type="number" id="gAAPE" placeholder="170">
        </div>
        <div class="input-group">
          <label>Daily Goal (hrs)</label>
          <input type="number" id="gDaily" placeholder="6" step="0.5">
        </div>
        <button class="btn" onclick="pushTargets()">Push Targets</button>
        <div id="targetsMsg" style="font-size:10px;color:var(--good);margin-top:8px"></div>
      </div>
    </div>
  </div>
</div>

<script>
const CONFIG = {
  SHEET_URL: "https://script.google.com/macros/s/AKfycbw_Ea7pgPXwX1FvPXWpcLJHP9t7gLsDlanp_IhgClHyD20KQhSgfOY7R1ymXb7HmtDr3w/exec",
  VERSION: "v3.0",
  EXAM_DATE: "2026-11-01"
};

const $ = id => document.getElementById(id);
const fmtDur = mins => { mins = Math.round(mins); if (mins < 60) return mins + 'm'; const h = Math.floor(mins/60), m = mins%60; return m ? h+'h '+m+'m' : h+'h'; };
const fmtH = m => { const h = m/60; return h >= 10 ? Math.round(h) : h.toFixed(1).replace(/\.0$/, ''); };
const todayKey = () => new Date().toLocaleDateString('en-CA');
const weekStart = (d = new Date()) => { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); x.setHours(0,0,0,0); return x.toLocaleDateString('en-CA'); };
const ago = ts => { if (!ts) return ''; const m = Math.floor((Date.now() - ts) / 60000); if (m < 1) return 'just now'; if (m < 60) return m + 'm ago'; return Math.floor(m/60) + 'h ' + (m%60) + 'm ago'; };

let SESSIONS = [], STATE = {}, TOPICS = [], currentTopicPaper = 'FR';

async function init() {
  $('version').textContent = CONFIG.VERSION;
  await pull();
  setInterval(pull, 30000);
  setInterval(pullLive, 5000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
}

async function pull() {
  try {
    const r = await fetch(CONFIG.SHEET_URL + '?t=' + Date.now());
    const d = await r.json();
    SESSIONS = d.sessions || [];
    STATE = d.state || {};
    TOPICS = d.topicsData || [];
    renderAll();
  } catch (e) { }
}

async function pullLive() {
  try {
    const r = await fetch(CONFIG.SHEET_URL + '?live=1&t=' + Date.now());
    const d = await r.json();
    renderLive(d);
  } catch (e) { }
}

function renderAll() {
  renderStats();
  renderPapers();
  renderTodaySessions();
  renderTopics();
  renderLog();
  renderCountdown();
  renderLive({});
}

function renderLive(l) {
  const on = l.status === 'studying';
  const ring = $('liveRing');
  const status = $('liveStatus');
  const meta = $('liveMeta');
  
  if (on) {
    ring.textContent = l.paper || '·';
    ring.classList.add('active');
    status.textContent = '🔴 Studying ' + (l.paper || '');
    status.style.color = 'var(--good)';
    const mins = l.startedAt ? Math.floor((Date.now() - l.startedAt) / 60000) : (l.elapsed || 0);
    meta.innerHTML = `<b>${l.paper || '—'}</b> · ${mins >= 60 ? Math.floor(mins/60)+'h ' : ''}${mins%60}m<br>started ${ago(l.startedAt || l.updated)}<br>${l.note || ''}`;
  } else {
    ring.textContent = '··';
    ring.classList.remove('active');
    status.textContent = 'Not studying';
    status.style.color = 'var(--muted)';
    meta.innerHTML = l.updated ? ('idle · last active ' + ago(l.updated)) : 'no activity yet';
  }
}

function renderStats() {
  const t = todayKey(), w = weekStart();
  const td = SESSIONS.filter(s => s.date === t).reduce((a,s) => a + s.mins, 0);
  const wk = SESSIONS.filter(s => weekStart(new Date(s.ts)) === w).reduce((a,s) => a + s.mins, 0);
  const tot = SESSIONS.reduce((a,s) => a + s.mins, 0);
  $('sToday').innerHTML = fmtDur(td);
  $('sWeek').innerHTML = fmtDur(wk);
  $('sTotal').innerHTML = fmtDur(tot);
}

function renderCountdown() {
  const diff = Math.ceil((new Date(CONFIG.EXAM_DATE) - new Date()) / 864e5);
  $('cd').textContent = diff > 0 ? diff : '0';
}

function renderPapers() {
  const papers = { FR: 0, AFM: 0, AAPE: 0 };
  SESSIONS.forEach(s => { if (papers[s.paper] !== undefined) papers[s.paper] += s.mins; });
  
  const html = Object.entries(papers).map(([p, m]) => {
    const target = (STATE.targets || {})[p] || 170;
    const pct = Math.min(100, Math.round((m / 60 / target) * 100));
    return `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px"><span>${p}</span><span>${fmtDur(m)} / ${target}h</span></div><div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div></div>`;
  }).join('');
  $('papers').innerHTML = html;
}

function renderTodaySessions() {
  const t = todayKey();
  const sess = SESSIONS.filter(s => s.date === t);
  const html = sess.length ? sess.map(s => `<div class="session-item">${s.paper} • ${fmtDur(s.mins)} <div class="time">${new Date(s.ts).toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit'})}</div></div>`).join('') : '<div style="color:var(--muted);font-size:11px">No sessions today</div>';
  $('todaySessions').innerHTML = html;
}

function renderTopics() {
  const filtered = (TOPICS || []).filter(t => t.paper === currentTopicPaper);
  const done = filtered.filter(t => t.done === 'TRUE' || t.done === true).length;
  
  if (filtered.length === 0) {
    $('topicsList').innerHTML = '<div style="color:var(--muted);font-size:11px;padding:12px;text-align:center">No topics yet</div>';
    return;
  }
  
  const html = `<div style="margin-bottom:8px;font-size:10px;color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--line)">${done}/${filtered.length} completed</div>` +
    filtered.map(t => `<div class="topic-row"><div class="name">${t.name}</div><div class="check">${t.done === 'TRUE' || t.done === true ? '✓' : ''}</div></div>`).join('');
  $('topicsList').innerHTML = html;
}

function switchTopics(p) {
  document.querySelectorAll('[data-tp]').forEach(b => {
    b.style.color = b.getAttribute('data-tp') === p ? 'var(--ink)' : 'var(--muted)';
    b.style.borderBottomColor = b.getAttribute('data-tp') === p ? 'var(--gold)' : 'transparent';
  });
  currentTopicPaper = p;
  renderTopics();
}

function renderLog() {
  const html = SESSIONS.length ? SESSIONS.slice().reverse().map(s => `<div class="session-item">${s.date} • ${s.paper} • ${fmtDur(s.mins)}</div>`).join('') : '<div style="color:var(--muted);font-size:11px">No sessions logged</div>';
  $('logList').innerHTML = html;
}

function switchView(v) {
  document.querySelectorAll('.view').forEach(x => x.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
  $('view-' + v).classList.add('on');
  document.querySelector(`[data-view="${v}"]`).classList.add('on');
}

async function pushTask() {
  const text = ($('gTask').value || '').trim();
  const date = $('gDate').value;
  if (!text || !date) { $('taskMsg').textContent = 'Enter task + date'; return; }
  
  await fetch(CONFIG.SHEET_URL, {
    method: 'POST',
    mode: 'no-cors',
    body: JSON.stringify({ type: 'guideAdd', planItem: { id: 'g' + Date.now(), text, date, done: false } })
  });
  
  $('gTask').value = '';
  $('gDate').value = '';
  $('taskMsg').textContent = '✓ Pushed!';
  setTimeout(() => { $('taskMsg').textContent = ''; pull(); }, 1500);
}

async function pushTargets() {
  const body = { type: 'guideAdd' };
  const tg = {};
  if ($('gFR').value) tg.FR = +$('gFR').value;
  if ($('gAFM').value) tg.AFM = +$('gAFM').value;
  if ($('gAAPE').value) tg.AAPE = +$('gAAPE').value;
  if (Object.keys(tg).length) body.targets = Object.assign({ FR: 170, AFM: 170, AAPE: 170 }, STATE.targets || {}, tg);
  if ($('gDaily').value) body.dailyGoal = +$('gDaily').value;
  
  await fetch(CONFIG.SHEET_URL, {
    method: 'POST',
    mode: 'no-cors',
    body: JSON.stringify(body)
  });
  
  $('targetsMsg').textContent = '✓ Targets pushed!';
  setTimeout(() => { $('targetsMsg').textContent = ''; pull(); }, 1500);
}

window.addEventListener('load', init);
</script>

</body>
</html>
